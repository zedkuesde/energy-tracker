services:
  energy-tracker:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    pids_limit: 100
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      NODE_ENV: production
      APP_PORT: '3000'
      APP_HOST: '0.0.0.0'
      DATABASE_PATH: /data/energy-tracker.sqlite
    volumes:
      - energy_tracker_data:/data
    ports:
      - '127.0.0.1:3020:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  energy_tracker_data:
